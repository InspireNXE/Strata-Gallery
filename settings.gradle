pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata-Gallery'

// Strata and its Java2D/Swing and Vulkan adapters, from the checkouts beside this one when they are there, so changes to them show
// at once. Without them, strata_version comes from Maven Central.
if (file('../Strata/settings.gradle').exists()) {
    includeBuild('../Strata') {
        dependencySubstitution {
            ['api', 'spi', 'core'].each { name ->
                substitute(module("org.inspirenxe:strata-${name}")).using(project(":${name}"))
            }
        }
    }
}
if (file('../Strata-Vulkan/settings.gradle').exists()) {
    includeBuild('../Strata-Vulkan') {
        dependencySubstitution {
            substitute(module('org.inspirenxe:strata-vulkan')).using(project(':'))
        }
    }
}
if (file('../Strata-Swing/settings.gradle').exists()) {
    includeBuild('../Strata-Swing') {
        dependencySubstitution {
            substitute(module('org.inspirenxe:strata-swing')).using(project(':'))
        }
    }
}

