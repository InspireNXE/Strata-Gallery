pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata-Gallery'

// Strata is not published yet, so the gallery builds against the sibling checkout
includeBuild('../Strata') {
    dependencySubstitution {
        ['api', 'spi', 'core'].each { name ->
            substitute(module("org.inspirenxe:strata-${name}")).using(project(":${name}"))
        }
    }
}

// The Java2D/Swing adapter, from the Strata-Swing checkout beside this one
includeBuild('../Strata-Swing') {
    dependencySubstitution {
        substitute(module('org.inspirenxe:strata-canvas-swing')).using(project(':canvas-swing'))
    }
}

// Every control on its own page, on the Java2D adapter
include('gallery')
