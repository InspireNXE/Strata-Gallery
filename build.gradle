plugins {
    id 'application'
}

description = 'A gallery of every Strata control, running on the Java2D adapter.'

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-classfile'])
}

dependencies {
    // Pages are written against the API only; the Java2D adapter shows them
    implementation("org.inspirenxe:strata-api:${strata_version}")
    implementation("org.inspirenxe:strata-canvas-swing:${strata_version}")

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty('java.awt.headless', 'true')
}

application {
    mainClass = 'org.inspirenxe.strata.gallery.Gallery'
}

// One jar with everything the gallery needs, so java -jar runs it
tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    dependsOn(configurations.runtimeClasspath)
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}
